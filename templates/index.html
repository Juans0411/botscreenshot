<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control Power BI Bot</title>
    <style>
        #container { border:2px solid #000; padding:10px; width:600px; margin:20px auto; font-family:Arial,sans-serif; }
        #div1, #div2 { border:2px solid #000; margin:10px; padding:10px; }
        #buttons { display:flex; justify-content:space-between; }
        button { padding:10px 20px; font-weight:bold; }
        pre { background:#f0f0f0; padding:10px; height:200px; overflow-y:scroll; white-space:pre-wrap; }
        img { margin-top:10px; border:1px solid #ccc; }
        input[type="text"] { width:80%; padding:8px; margin:5px 0 10px; }
    </style>
</head>
<body>
    <div id="container">
        <div id="div1">
            <label for="contacto">Contacto:</label>
            <input type="text" id="contacto" placeholder="Nombre o número de WhatsApp" required>
            <div id="buttons">
                <button onclick="startScript('bot_powerbi_update.py')">VD Diario</button>
                <button onclick="startScript('bot_powerbi_multipestanas.py')">Competencia Equipos</button>
                <button onclick="startScript('report_oficinas_diario.py')">Oficinas Diario</button>
                <button onclick="startScript('report_oficinas_mensual.py')">Oficinas Mensual</button>
                <button onclick="stopScript()">Detener</button>
            </div>
        </div>
        <div id="div2">
            <pre id="output">Esperando proceso...</pre>
            <hr>
            <h4>Última captura enviada:</h4>
            <img id="captura" src="/ultima_captura" width="100%" alt="Captura aún no disponible">
        </div>
    </div>
    <script>
        function startScript(scriptName) {
            const output = document.getElementById("output");
            const contacto = document.getElementById("contacto").value.trim();
            if (!contacto) { alert("Por favor, ingresa el nombre o número del contacto."); return; }
            output.textContent = "Esperando proceso...\n";
            fetch("/start", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ contacto, script: scriptName })
            }).then(() => pollLogs());
        }
        function stopScript() {
            fetch("/stop",{method:"POST"})
            .then(r=>r.json()).then(data=>{
                const o=document.getElementById("output");
                o.textContent+= data.status==="terminated"
                    ? "\n[INFO] Proceso detenido manualmente.\n"
                    : "\n[INFO] No había un proceso en ejecución.\n";
                o.scrollTop=o.scrollHeight;
            });
        }
        function pollLogs() {
            fetch("/logs").then(r=>r.json()).then(data=>{
                if (data.log.trim()!=="") {
                    const o=document.getElementById("output");
                    o.textContent+=data.log;
                    o.scrollTop=o.scrollHeight;
                    document.getElementById("captura").src="/ultima_captura?"+Date.now();
                }
                setTimeout(pollLogs,1000);
            });
        }
    </script>
</body>
</html>
